services:
  postgres:
    image: postgres:16-alpine
    container_name: edupilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edupilot
      POSTGRES_USER: edupilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - edupilot_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupilot -d edupilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  edupilot_pgdata:
